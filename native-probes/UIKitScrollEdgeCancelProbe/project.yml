name: UIKitScrollEdgeCancelProbe

options:
  bundleIdPrefix: com.innei.probes
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 5.0

targets:
  UIKitScrollEdgeCancelProbe:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.innei.probes.UIKitScrollEdgeCancel
        PRODUCT_NAME: UIKitScrollEdgeCancelProbe
        TARGETED_DEVICE_FAMILY: 1

schemes:
  UIKitScrollEdgeCancelProbe:
    build:
      targets:
        UIKitScrollEdgeCancelProbe: all
    run:
      config: Debug
