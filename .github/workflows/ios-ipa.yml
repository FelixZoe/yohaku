name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

concurrency:
  group: ios-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable

      - name: Select newest Xcode
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app
          # Expo SDK 57 needs Swift 6.2 (Xcode 26.x); Xcode 26.3's clang errors on
          # SWIFT_RETURNS_* annotations in expo-modules-jsi vendored RN headers.
          XCODE_APP=$(ls -d /Applications/Xcode_26.2*.app 2>/dev/null | head -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v "26\.3" | sort -V | tail -1)
          fi
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE_APP"
          echo "Using $XCODE_APP"
          xcodebuild -version
          swift --version 2>&1 | head -1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Patch expo-modules-jsi (upstream bug: SWIFT_RETURNS_RETAINED on constructors)"
        run: |
          FILE=$(find node_modules/.pnpm -path "*expo-modules-jsi*/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h" | head -1)
          echo "patching $FILE"
          sed -i.bak 's/^  SWIFT_RETURNS_RETAINED RuntimeScheduler/  RuntimeScheduler/' "$FILE"
          ! grep -n "SWIFT_RETURNS" "$FILE"

      - name: Build rich-content css
        run: pnpm --filter @yohaku/rich-content build:css

      - name: Expo prebuild (ios)
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild -p ios

      - name: Resolve workspace and scheme
        id: xcode
        working-directory: apps/mobile
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          # Expo names the app scheme after the app, matching the workspace name;
          # -list output is polluted by dozens of pod schemes.
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          LISTED=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2 | sed 's/^[[:space:]]*//' | grep -v '^$')
          echo "$LISTED" | grep -Fxq "$SCHEME" || SCHEME=$(echo "$LISTED" | grep -iv 'notification' | head -1)
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE scheme=$SCHEME"

      - name: Xcode build (unsigned, device)
        working-directory: apps/mobile
        run: |
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned IPA
        working-directory: apps/mobile
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry Yohaku-unsigned.ipa Payload
          ls -lh Yohaku-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yohaku-unsigned-ipa
          path: apps/mobile/Yohaku-unsigned.ipa
          retention-days: 30
