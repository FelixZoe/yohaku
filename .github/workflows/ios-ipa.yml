name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/mobile-overlay/**'
      - 'yohaku-oss/**'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: ios-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select newest Xcode
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app
          # Expo SDK 57 needs Swift 6.2 (Xcode 26.x); Xcode 26.3's clang errors on
          # SWIFT_RETURNS_* annotations in expo-modules-jsi vendored RN headers.
          XCODE_APP=$(ls -d /Applications/Xcode_26.2*.app 2>/dev/null | head -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v "26\.3" | sort -V | tail -1)
          fi
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE_APP"
          echo "Using $XCODE_APP"
          xcodebuild -version
          swift --version 2>&1 | head -1

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch expo-modules-jsi (upstream bug: SWIFT_RETURNS_RETAINED on constructors)
        run: |
          COUNT=0
          while IFS= read -r FILE; do
            echo "patching $FILE"
            sed -i.bak 's/^  SWIFT_RETURNS_RETAINED RuntimeScheduler/  RuntimeScheduler/' "$FILE"
            COUNT=$((COUNT+1))
          done < <(find node_modules/.pnpm -path "*expo-modules-jsi*/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h" 2>/dev/null)
          echo "patched $COUNT file(s)"
          [ "$COUNT" -gt 0 ]
          LEFT=$(find node_modules/.pnpm -path "*expo-modules-jsi*/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h" -exec grep -l "SWIFT_RETURNS" {} \; 2>/dev/null)
          [ -z "$LEFT" ]

      - name: Build rich-content css
        run: pnpm --filter @yohaku/rich-content build:css

      - name: Expo prebuild (ios)
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild -p ios

      - name: Resolve workspace and scheme
        id: xcode
        working-directory: apps/mobile
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          # Expo names the app scheme after the app, matching the workspace name;
          # -list output is polluted by dozens of pod schemes.
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          LISTED=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2 | sed 's/^[[:space:]]*//' | grep -v '^$')
          echo "$LISTED" | grep -Fxq "$SCHEME" || SCHEME=$(echo "$LISTED" | grep -iv 'notification' | head -1)
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE scheme=$SCHEME"

      - name: Xcode build (unsigned, device)
        working-directory: apps/mobile
        run: |
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned IPA
        working-directory: apps/mobile
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry Yohaku-unsigned.ipa Payload
          ls -lh Yohaku-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yohaku-unsigned-ipa
          path: apps/mobile/Yohaku-unsigned.ipa
          retention-days: 30

      - name: Export OTA update bundle
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo export --platform ios --output-dir ota-dist

      - name: Upload OTA update to self-hosted server
        working-directory: apps/mobile
        env:
          OTA_TOKEN: ${{ secrets.OTA_TOKEN }}
        run: |
          RV=$(npx expo config --type public --json 2>/dev/null | node -e "
            let raw='';process.stdin.on('data',d=>raw+=d).on('end',()=>{
              try { const c=JSON.parse(raw); console.log(c.runtimeVersion || '1.0.4'); }
              catch { console.log('1.0.4'); }
            })")
          echo "runtimeVersion=$RV"
          node - "$RV" <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const https = require('https')
          const [, rvArg] = process.argv
          const rv = rvArg || '1.0.4'
          const dist = 'ota-dist'
          const meta = JSON.parse(fs.readFileSync(path.join(dist, 'metadata.json'), 'utf8'))
          const ios = meta.fileMetadata && meta.fileMetadata.ios
          if (!ios) throw new Error('metadata.json has no ios entry')
          const rel = (p) => path.join(dist, p)
          const collect = {}
          for (const b of ios.bundles || []) collect[b.path] = fs.readFileSync(rel(b.path)).toString('base64')
          for (const a of ios.assets || []) collect[a.path] = fs.readFileSync(rel(a.path)).toString('base64')
          const payload = JSON.stringify({
            platform: 'ios',
            runtimeVersion: rv,
            version: process.env.EXPO_PUBLIC_APP_VERSION || null,
            files: collect,
          })
          const req = https.request('https://api.root.mom/ota/api/update', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-ota-token': process.env.OTA_TOKEN,
              'content-length': Buffer.byteLength(payload),
            },
          }, (res) => {
            let out = ''
            res.on('data', (d) => (out += d))
            res.on('end', () => {
              console.log('OTA upload:', res.statusCode, out)
              if (res.statusCode !== 200) process.exit(1)
            })
          })
          req.on('error', (e) => { console.error(e); process.exit(1) })
          req.write(payload)
          req.end()
          NODE
