name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/mobile-overlay/**'
      - 'yohaku-oss/**'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: ios-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select newest Xcode
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app
          # Expo SDK 57 needs Swift 6.2 (Xcode 26.x); Xcode 26.3's clang errors on
          # SWIFT_RETURNS_* annotations in expo-modules-jsi vendored RN headers.
          XCODE_APP=$(ls -d /Applications/Xcode_26.2*.app 2>/dev/null | head -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v "26\.3" | sort -V | tail -1)
          fi
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE_APP"
          echo "Using $XCODE_APP"
          xcodebuild -version
          swift --version 2>&1 | head -1

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Patch expo-modules-jsi (upstream bug: SWIFT_RETURNS_RETAINED on constructors)"
        run: |
          COUNT=0
          while IFS= read -r FILE; do
            echo "patching $FILE"
            sed -i.bak 's/^  SWIFT_RETURNS_RETAINED RuntimeScheduler/  RuntimeScheduler/' "$FILE"
            COUNT=$((COUNT+1))
          done < <(find node_modules/.pnpm -path "*expo-modules-jsi*/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h" 2>/dev/null)
          echo "patched $COUNT file(s)"
          [ "$COUNT" -gt 0 ]
          LEFT=$(find node_modules/.pnpm -path "*expo-modules-jsi*/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h" -exec grep -l "SWIFT_RETURNS" {} \; 2>/dev/null)
          [ -z "$LEFT" ]

      - name: Build rich-content css
        run: pnpm --filter @yohaku/rich-content build:css

      - name: Expo prebuild (ios)
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild -p ios

      - name: Resolve workspace and scheme
        id: xcode
        working-directory: apps/mobile
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          # Expo names the app scheme after the app, matching the workspace name;
          # -list output is polluted by dozens of pod schemes.
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          LISTED=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | sed -n '/Schemes:/,$p' | tail -n +2 | sed 's/^[[:space:]]*//' | grep -v '^$')
          echo "$LISTED" | grep -Fxq "$SCHEME" || SCHEME=$(echo "$LISTED" | grep -iv 'notification' | head -1)
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE scheme=$SCHEME"

      - name: Xcode build (unsigned, device)
        working-directory: apps/mobile
        run: |
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned IPA
        working-directory: apps/mobile
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry Yohaku-unsigned.ipa Payload
          ls -lh Yohaku-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yohaku-unsigned-ipa
          path: apps/mobile/Yohaku-unsigned.ipa
          retention-days: 30

      - name: Export OTA update bundle
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo export --platform ios --output-dir ota-dist

      - name: Upload OTA update via server tunnel
        working-directory: apps/mobile
        env:
          OTA_TOKEN: ${{ secrets.OTA_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          RV=$(node -p "JSON.parse(require('fs').readFileSync(process.env.GITHUB_WORKSPACE + '/apps/mobile-overlay/expo.json','utf8')).version || '1.0.4'")
          echo "runtimeVersion=$RV (policy: appVersion)"
          node - "$RV" <<'NODE' > /tmp/ota_payload.json
          const fs = require('fs')
          const path = require('path')
          const rv = process.argv[2] || '1.0.4'
          const dist = 'ota-dist'
          function walk(dir, prefix = '') {
            const out = []
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const rel = prefix ? prefix + '/' + e.name : e.name
              if (e.isDirectory()) out.push(...walk(path.join(dir, e.name), rel))
              else out.push(rel)
            }
            return out
          }
          const collect = {}
          for (const rel of walk(dist)) {
            if (rel === 'metadata.json') continue
            collect[rel] = fs.readFileSync(path.join(dist, rel)).toString('base64')
          }
          // Full resolved public config -> extra.expoClient. Without it,
          // expo-constants reads a crippled manifest after the update is
          // applied and the app can crash on launch.
          const expoClient = JSON.parse(
            require('child_process')
              .execSync('npx expo config --type public --json 2>/dev/null', {
                maxBuffer: 64 * 1024 * 1024,
              })
              .toString(),
          )
          process.stdout.write(JSON.stringify({
            platform: 'ios',
            runtimeVersion: rv,
            version: rv,
            files: collect,
            extra: { expoClient },
          }))
          NODE
          ls -lh /tmp/ota_payload.json
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -q -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key /tmp/ota_payload.json \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/ota_payload.json"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo curl -sf -X POST http://127.0.0.1:2334/api/update -H 'Content-Type: application/json' -H 'x-ota-token: $OTA_TOKEN' --data-binary @/tmp/ota_payload.json && rm -f /tmp/ota_payload.json && echo OTA_STORED"
