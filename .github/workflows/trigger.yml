name: Trigger Remote Deploy

on:
  push:
    branches:
      - main
      - refactor/remix
    paths-ignore:
      - 'apps/mobile/**'
      - 'packages/dom-webview/**'
  workflow_dispatch:
    inputs:
      route:
        description: 'Which route to trigger'
        required: true
        type: choice
        options:
          - auto
          - main
          - remix
        default: auto

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve event type
        id: resolve
        env:
          REF: ${{ github.ref_name }}
          INPUT_ROUTE: ${{ github.event.inputs.route }}
        run: |
          route="${INPUT_ROUTE:-auto}"
          if [ "$route" = "auto" ] || [ -z "$route" ]; then
            case "$REF" in
              main)            route=main ;;
              refactor/remix)  route=remix ;;
              *)
                echo "::notice::Branch '$REF' has no remote-deploy mapping, skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "event_type=trigger-$route" >> "$GITHUB_OUTPUT"

      - name: Dispatch remote-deploy workflow
        if: steps.resolve.outputs.skip != 'true'
        env:
          EVENT_TYPE: ${{ steps.resolve.outputs.event_type }}
          ROUTE: ${{ steps.resolve.outputs.route }}
        run: |
          echo "Dispatching $EVENT_TYPE for route=$ROUTE"
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Innei/yohaku-remote-deploy/dispatches \
            -d "{\"event_type\": \"$EVENT_TYPE\", \"client_payload\": {\"route\": \"$ROUTE\", \"source_ref\": \"${{ github.ref_name }}\", \"source_sha\": \"${{ github.sha }}\"}}"
