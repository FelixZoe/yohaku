name: Trigger Remote Ship

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'apps/mobile-overlay/**'
      - 'packages/dom-webview/**'
      - 'packages/rich-content/**'
      # design-system is a symlink into the yohaku-oss submodule; the bare
      # paths match the link itself and the submodule pointer bump.
      - 'packages/design-system'
      - 'yohaku-oss'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref in this repo to ship (branch, tag, or SHA). Empty = this run’s SHA.'
        required: false
        type: string
      notes:
        description: 'Optional TestFlight / OTA notification notes'
        required: false
        type: string
      force_testflight:
        description: 'Skip OTA and archive a TestFlight build'
        required: false
        type: boolean
        default: false

concurrency:
  group: trigger-ship
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve source commit
        id: src
        env:
          INPUT_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          requested="${INPUT_REF:-$GITHUB_SHA}"
          resolved="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${requested}" --jq .sha)"
          if [[ ! "$resolved" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve ${GITHUB_REPOSITORY}@${requested} to a full SHA."
            exit 1
          fi
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
          echo "Resolved $requested → $resolved"

      - name: Cancel superseded remote ship runs
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          repo="Innei/yohaku-remote-deploy"
          cancelled=0
          for workflow in ship.yml testflight.yml; do
            for status in queued in_progress; do
              ids="$(gh api --paginate "repos/${repo}/actions/workflows/${workflow}/runs?status=${status}" --jq '.workflow_runs[].id')" || {
                echo "::warning::Failed to list ${workflow} ${status} runs; remote queue left as-is."
                continue
              }
              for id in $ids; do
                if gh api -X POST "repos/${repo}/actions/runs/${id}/cancel" >/dev/null 2>&1; then
                  echo "Cancelled superseded ${workflow} ${status} run ${id}"
                  cancelled=$((cancelled + 1))
                else
                  echo "::warning::Could not cancel run ${id} (may have just finished)."
                fi
              done
            done
          done
          echo "Superseded remote runs cancelled: ${cancelled}"

      - name: Dispatch remote ship workflow
        env:
          SOURCE_REF: ${{ steps.src.outputs.requested }}
          SOURCE_SHA: ${{ steps.src.outputs.resolved }}
          NOTES: ${{ inputs.notes }}
          FORCE_TESTFLIGHT: ${{ inputs.force_testflight }}
        run: |
          payload=$(jq -n \
            --arg event_type "trigger-ship" \
            --arg source_ref "$SOURCE_REF" \
            --arg source_sha "$SOURCE_SHA" \
            --arg notes "$NOTES" \
            --argjson force_testflight "${FORCE_TESTFLIGHT:-false}" \
            --arg actor "${{ github.actor }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              event_type: $event_type,
              client_payload: {
                source_ref: $source_ref,
                source_sha: $source_sha,
                notes: $notes,
                force_testflight: $force_testflight,
                actor: $actor,
                trigger_run_url: $run_url
              }
            }')

          echo "Dispatching trigger-ship source_ref=$SOURCE_REF source_sha=$SOURCE_SHA force_testflight=${FORCE_TESTFLIGHT:-false}"
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Innei/yohaku-remote-deploy/dispatches \
            -d "$payload"
